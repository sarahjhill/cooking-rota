{% extends "base.html" %}

{% block title %}{{ heading }} &mdash; Community Cooking Rota{% endblock %}

{% block content %}
  <h1>{{ heading }}</h1>
  <p class="muted">For {{ rota.recipient_name }}</p>

  <div class="card form-card">
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="btn" type="submit">Save</button>
    </form>
  </div>
{% endblock %}
