<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Something went wrong — Community Cooking Rota</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        background: #f8f5f1;
        color: #1f2933;
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        box-sizing: border-box;
      }
      .card {
        background: #ffffff;
        border-radius: 12px;
        box-shadow: 0 8px 24px rgba(31, 41, 51, 0.08);
        padding: 2rem;
        max-width: 32rem;
        text-align: center;
      }
      h1 {
        margin-top: 0;
      }
      a.btn {
        display: inline-block;
        margin-top: 1rem;
        background: #b85c38;
        color: #fff;
        padding: 0.6rem 1.2rem;
        border-radius: 8px;
        text-decoration: none;
        font-weight: 600;
      }
      a.btn:hover {
        background: #8a4128;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Something went wrong on our end</h1>
      <p>
        That's not something you did — the site hit a problem loading this
        page. Please try again in a moment.
      </p>
      <a class="btn" href="/">Back to Rotas</a>
    </div>
  </body>
</html>
