{% extends "base.html" %}

{% block title %}Log in &mdash; Community Cooking Rota{% endblock %}

{% block content %}
  <h1>Log in</h1>

  <div class="card form-card">
    {% if form.errors %}
      <p class="form-error" role="alert">That username and password don't match. Please try again.</p>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="btn" type="submit">Log in</button>
    </form>

    <p class="muted">
      No account yet? <a href="{% url 'rota:signup' %}">Create one</a>.
    </p>
  </div>
{% endblock %}
